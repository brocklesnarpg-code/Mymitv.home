name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q GlassyLauncher-project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
        working-directory: GlassyLauncher
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v2.0-${{ github.run_number }}" GlassyLauncher/app/build/outputs/apk/debug/app-debug.apk --title "Glassy Launcher build ${{ github.run_number }}" --notes "Debug APK"
